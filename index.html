<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hermes</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#050b14;
  --card:#0d1726;
  --card2:#111e30;
  --border:rgba(255,255,255,.08);
  --text:#f5f7fb;
  --muted:#8e9bad;
  --blue:#4f8cff;
  --green:#27d69a;
  --danger:#ff5d6c;
  --shadow:0 20px 60px rgba(0,0,0,.35)
}

html,body{
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif
}

body{
  min-height:100vh;
  overflow-x:hidden
}

button,input,textarea{
  font:inherit
}

button{
  border:0;
  cursor:pointer
}

.app{
  width:100%;
  max-width:900px;
  min-height:100vh;
  margin:auto;
  padding-bottom:90px
}

.top{
  padding:26px 18px 12px
}

.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}

.brand-left{
  display:flex;
  align-items:center;
  gap:13px
}

.logo{
  width:52px;
  height:52px;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#5d98ff,#255dd8);
  box-shadow:0 12px 30px rgba(55,115,255,.25);
  overflow:hidden
}

.logo img{
  width:34px;
  height:34px
}

.brand h1{
  font-size:23px;
  letter-spacing:-.5px
}

.brand p{
  color:var(--muted);
  font-size:13px;
  margin-top:3px
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#777
}

.dot.online{
  background:var(--green);
  box-shadow:0 0 12px rgba(39,214,154,.7)
}

.hero{
  margin:15px 18px 18px;
  padding:25px 21px;
  border:1px solid var(--border);
  border-radius:25px;
  background:
    radial-gradient(circle at 90% 0%,rgba(72,125,255,.22),transparent 40%),
    linear-gradient(145deg,#0f1c2e,#0a1422);
  box-shadow:var(--shadow)
}

.hero .greeting{
  font-size:28px;
  font-weight:700;
  letter-spacing:-.8px
}

.hero .sub{
  color:var(--muted);
  margin-top:8px;
  line-height:1.5;
  font-size:14px
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
  margin-top:20px
}

.quick{
  min-height:120px;
  text-align:left;
  padding:17px;
  border-radius:19px;
  background:rgba(255,255,255,.045);
  border:1px solid var(--border);
  color:var(--text)
}

.quick:active{
  transform:scale(.98)
}

.quick .icon{
  font-size:25px;
  margin-bottom:12px
}

.quick .title{
  font-weight:650;
  font-size:14px
}

.quick .desc{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
  line-height:1.35
}

.section{
  padding:0 18px;
  margin-top:22px
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:11px
}

.section-title{
  font-size:17px;
  font-weight:700
}

.section-action{
  color:#77a7ff;
  background:none;
  font-size:12px
}

.card,
.list-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  overflow:hidden
}

.empty{
  padding:22px;
  color:var(--muted);
  font-size:13px;
  text-align:center
}

.item{
  display:flex;
  align-items:center;
  gap:13px;
  padding:16px;
  border-bottom:1px solid var(--border)
}

.item:last-child{
  border-bottom:0
}

.time{
  min-width:58px;
  font-size:14px;
  font-weight:700;
  color:#8eb5ff
}

.rmain{
  flex:1;
  min-width:0
}

.rtitle{
  font-size:14px;
  font-weight:600;
  word-break:break-word
}

.rmeta{
  color:var(--muted);
  font-size:11px;
  margin-top:4px
}

.ghost{
  width:34px;
  height:34px;
  border-radius:10px;
  background:rgba(255,255,255,.05);
  color:#a9b2c0;
  font-size:20px
}

.view{
  display:none
}

.view.active{
  display:block
}

.chat-wrap{
  min-height:calc(100vh - 130px);
  padding:18px;
  padding-bottom:180px
}

.chat-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:17px
}

.chat-head h2{
  font-size:22px
}

.chat-head p{
  color:var(--muted);
  font-size:12px;
  margin-top:3px
}

.messages{
  display:flex;
  flex-direction:column;
  gap:12px
}

.bubble{
  max-width:90%;
  padding:13px 15px;
